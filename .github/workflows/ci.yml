name: CI

# Builds rwc, rwcry, and rwe and runs the compiler and user-library test
# suites inside the Nix development shell (flake.nix), which pins GHC, the
# simulators the golden tests lint and cosimulate with (iverilog, verilator,
# ghdl), z3, and the Lean toolchain for the --certify validator. Stack
# builds the Haskell packages (and, from the pinned Cryptol tree, the
# cryptol executable the Cryptol cosimulation leg uses); Nix supplies
# everything else. Optional tools are required (--require-tools and
# RWC_TEST_REQUIRE_RWV), so a missing simulator fails the run rather than
# silently skipping its legs. The embedder tests (rwe-test) need Isabelle
# and the AFP and do not run here.
#
# The test job also builds the Haddock documentation of every package
# (scripts/haddock-site.sh), kept as a run artifact. For master, the docs
# job then publishes it to the gh-pages branch under haddock/, beside the
# mdbook the Tutorial workflow deploys there, so that it is served at
# https://rewire-hardware.github.io/ReWire/haddock/.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Every step runs inside the flake's development shell.
    shell: nix develop --command bash -euo pipefail {0}

env:
  LANG: C.UTF-8
  RWC_TEST_REQUIRE_RWV: 1

jobs:
  test:
    name: Build and test
    # GitHub-hosted by default; set the repository variable CI_RUNS_ON to a
    # self-hosted runner label (e.g. nixos) to run there instead.
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # A self-hosted runner (a NixOS machine) already has Nix.
      - uses: cachix/install-nix-action@v31
        if: runner.environment == 'github-hosted'

      # Stack's state for the shell's GHC (the shell hook sets STACK_ROOT and
      # STACK_WORK to keep it apart from a Stack-managed GHC's). Keyed on
      # what determines it: flake.lock (the GHC comes from nixpkgs), the
      # resolver and its lock file, and every package.yaml; a partial match
      # only ever restores a build made with the same GHC.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.stack-nix
            .stack-work-nix
            */.stack-work-nix
          key: stack-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', '**/package.yaml') }}
          restore-keys: |
            stack-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      - uses: actions/cache@v6
        with:
          path: verify/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('verify/**/*.lean', 'verify/lakefile.toml', 'verify/lake-manifest.json', 'verify/lean-toolchain') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      - name: Show the toolchain
        run: |
          ghc --numeric-version
          stack --version
          iverilog -V
          verilator --version
          ghdl --version
          z3 --version
          lean --version

      # rwc-test finds the validator in verify/.lake/build/bin.
      - name: Build the certificate validator
        run: cd verify && lake build rwv-cstep-validate

      - name: Build
        run: |
          stack build --test --bench --no-run-tests --no-run-benchmarks
          # The cryptol executable, from the pinned Cryptol tree (in the
          # snapshot bin directory, on the PATH under stack test).
          stack build cryptol
          stack exec -- cryptol --version

      - name: Test the compiler
        run: stack test rewire:rwc-test --test-arguments="--require-tools --integration"

      - name: Test the user library
        run: stack test rewire-user

      # After the tests, so that a documentation failure never hides a test
      # failure. A minute or two: Stack reconfigures every package for its
      # first --haddock build (relinking the executables; only the two
      # packages with test suites recompile, for their smaller component
      # set) and Haddock re-typechecks every module.
      - name: Build the documentation
        run: scripts/haddock-site.sh haddock-site

      - name: Upload the documentation
        uses: actions/upload-artifact@v7
        with:
          name: haddock
          path: haddock-site

      # The generated outputs the golden tests diffed (foo.out.* beside the
      # goldens in the data directory), for inspecting a failure.
      - name: Upload test outputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-outputs
          path: |
            **/tests/golden/*.out.*
            **/tests/integration/*.out.*
          if-no-files-found: ignore

  docs:
    name: Publish the documentation
    needs: test
    # The master branch only: its pushes and manual runs, never a PR.
    if: github.ref == 'refs/heads/master'
    # A GitHub-hosted runner whatever CI_RUNS_ON says: the job needs neither
    # Nix nor the self-hosted machine, and it relies on a fresh workspace and
    # home directory -- a self-hosted runner's persist from job to job, and
    # download-artifact adds to whatever is already in its path.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One push to gh-pages at a time, shared with the Tutorial workflow.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    defaults:
      run:
        # Not the workflow's Nix shell: this job needs none.
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: haddock
          path: haddock-site

      # Replaces haddock/ in the gh-pages branch (keep_files is off, so the
      # pages of renamed or removed modules do not linger) and leaves the
      # rest of the branch -- the hand-maintained Jekyll site and the
      # tutorial -- as it is.
      - name: Publish to gh-pages/haddock
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: haddock-site
          destination_dir: haddock
          # The rest of gh-pages is a Jekyll site; without this the action
          # adds a .nojekyll file that disables Jekyll for the whole site.
          enable_jekyll: true
          full_commit_message: 'Deploy haddock from ${{ github.sha }}'
