  __in2: 7
- __in0: 0xff
  __in1: 0x00
  __in2: 1
- __in0: 0x00
  __in1: 0x00
  __in2: 0
- __in0: 0x7f
  __in1: 0x02
  __in2: 6
- __in0: 0xa5
  __in2: 3
- __in0: 0x01
  __in1: 0xff
  __in2: 2
- __in0: 0xfe
  __in1: 0x10
